name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck, lint, unused code, duplicates, format, unit tests with coverage
        run: npm run check
      - name: Build and bundle budget
        run: npm run build && npm run budget
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: End-to-end and accessibility (no API keys)
        run: npm run e2e
      - name: Dependency audit (production)
        run: npm audit --omit=dev --audit-level=high
